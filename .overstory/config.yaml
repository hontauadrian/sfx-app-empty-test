# Overstory configuration
# See: https://github.com/overstory/overstory

project:
  name: test-223
  root: /Users/mako/Documents/GitHub/sfx-webapp-boilerplate
  canonicalBranch: dev
  qualityGates:
    - name: Tests
      command: pnpm test
      description: all tests must pass
    - name: Lint
      command: pnpm lint
      description: zero errors
    - name: Typecheck
      command: pnpm typecheck
      description: no TypeScript errors
    - name: Integration Tests
      command: pnpm test:integration
      description: integration tests must pass (API endpoints, cross-module, DB)
agents:
  manifestPath: .overstory/agent-manifest.json
  baseDir: .overstory/agent-defs
  maxConcurrent: 6
  staggerDelayMs: 2000
  maxDepth: 3
  maxSessionsPerRun: 0
  maxAgentsPerLead: 2
worktrees:
  baseDir: .overstory/worktrees
  postCreate:
    command: pnpm env:hydrate && pnpm install --frozen-lockfile --prefer-offline
    timeoutMs: 180000
  preTeardown:
    command: pnpm stack:down
    timeoutMs: 90000
    # Deterministic fallback when `command` is missing, exits non-zero, or
    # times out. ov stop runs this with the same env (incl
    # OVERSTORY_WORKTREE_BASENAME) and cwd. The per-worktree compose project
    # is `app-<basename>` per scripts/stack-up-docker.sh, so we can
    # reproduce it without poking at .env. Remove this field if the project
    # doesn't use docker.
    fallbackCommand: docker compose -p app-${OVERSTORY_WORKTREE_BASENAME} down -v
    fallbackTimeoutMs: 60000
taskTracker:
  backend: auto
  enabled: true
mulch:
  enabled: true
  domains: []
  primeFormat: markdown
merge:
  aiResolveEnabled: true
  reimagineEnabled: false
canonicalRebuild:
  command: bash scripts/post-merge-canonical.sh
  timeoutMs: 1800000
  notifyAgent: coordinator
  tailLines: 200
providers:
  anthropic:
    type: native
watchdog:
  tier0Enabled: true
  tier0IntervalMs: 30000
  tier1Enabled: true
  tier2Enabled: true
  staleThresholdMs: 900000   # 15 min — allow long builds, test runs, intentional mail waits
  zombieThresholdMs: 1800000 # 30 min — only terminate after clearly abandoned work
  nudgeIntervalMs: 60000
  rpcTimeoutMs: 5000
  triageTimeoutMs: 15000
  maxEscalationLevel: 3
coordinator:
  exitTriggers:
    allAgentsDone: false
    taskTrackerEmpty: false
    onShutdownSignal: false
models:
logging:
  verbose: false
  redactSecrets: true
runtime:
  default: claude
  shellInitDelayMs: 0
  pi:
    provider: anthropic
    modelMap:
      opus: anthropic/claude-opus-4-6
      sonnet: anthropic/claude-sonnet-4-6
      haiku: anthropic/claude-haiku-4-5
