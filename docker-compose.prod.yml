services:
  web:
    build:
      target: production
    volumes: !override []
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001

  api:
    build:
      target: production
    volumes: !override []
    ports: !override []
    environment:
      - DATABASE_URL=postgresql://sfx:sfx@postgres:5432/sfx_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - NODE_ENV=production
